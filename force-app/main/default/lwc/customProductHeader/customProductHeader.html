<template>
    <lightning-accordion allow-multiple-sections-open>
        <!-- Section 1: Update Quote Fields -->
        <template lwc:if={isQuoteSectionVisible}>
            <lightning-accordion-section name="quote" label="Update Quote Fields">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="checkbox"
                            label="Ready for Review"
                            name="readyForReview"
                            checked={readyForReviewValue}
                            onchange={handleReadyForReviewChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Fulfilled by"
                            name="fulfilledBy"
                            value={fulfilledByValue}
                            options={fulfilledByOptions}
                            onchange={handleFulfilledByChange}
                        ></lightning-combobox>
                        <template lwc:if={showQuoteFieldsSave}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleQuoteFieldsSave}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>

        <!-- Section 2: Update Quote Line Item Fields -->
        <template lwc:if={isQuoteLineSectionVisible}>
            <lightning-accordion-section name="quoteLine" label="Update Quote Line Item Fields">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Special Note"
                            name="input1"
                            value={input1Value}
                            onchange={handleInput1Change}
                        ></lightning-input>
                        <template lwc:if={showInput1SaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleInput1Save}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleInput1Cancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="toggle"
                            label="Apply Contingency"
                            name="input2"
                            checked={input2Value}
                            onchange={handleInput2Change}
                        ></lightning-input>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>

        <!-- Section 3: Update Terms -->
        <template lwc:if={isTermSectionVisible}>
            <lightning-accordion-section name="terms" label="Update Terms">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-slider
                            label="Term (year)"
                            name="term"
                            min="1"
                            max="5"
                            value={termValue}
                            onchange={handleTermChange}
                        ></lightning-slider>
                        <template lwc:if={showTermSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleTermSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleTermCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>
    </lightning-accordion>
</template>
