<template>
    <lightning-accordion allow-multiple-sections-open>
        <!-- Section 1: Update Quote Fields -->
        <template lwc:if={isQuoteSectionVisible}>
            <lightning-accordion-section name="quote" label="Update Quote Fields">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="checkbox"
                            label="Ready for Review"
                            name="readyForReview"
                            checked={readyForReviewValue}
                            onchange={handleReadyForReviewChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Fulfilled by"
                            name="fulfilledBy"
                            value={fulfilledByValue}
                            options={fulfilledByOptions}
                            onchange={handleFulfilledByChange}
                        ></lightning-combobox>
                        <template lwc:if={showQuoteFieldsSave}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleQuoteFieldsSave}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>

        <!-- Section 2: Update Quote Line Item Fields -->
        <template lwc:if={isQuoteLineSectionVisible}>
            <lightning-accordion-section name="quoteLine" label="Update Quote Line Item Fields">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Special Note"
                            name="input1"
                            value={input1Value}
                            onchange={handleInput1Change}
                        ></lightning-input>
                        <template lwc:if={showInput1SaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleInput1Save}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleInput1Cancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="toggle"
                            label="Apply Contingency"
                            name="input2"
                            checked={input2Value}
                            onchange={handleInput2Change}
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="number"
                            formatter="percent-fixed"
                            step="0.01"
                            label="Target Margin"
                            name="targetMargin"
                            value={targetMarginValue}
                            onchange={handleTargetMarginChange}
                        ></lightning-input>
                        <template lwc:if={showTargetMarginSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleTargetMarginSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleTargetMarginCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="number"
                            formatter="currency"
                            step="0.01"
                            label="Target Price"
                            name="targetPrice"
                            value={targetPriceValue}
                            onchange={handleTargetPriceChange}
                        ></lightning-input>
                        <template lwc:if={showTargetPriceSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleTargetPriceSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleTargetPriceCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="date"
                            label="Estimated Delivery Date"
                            name="estDeliveryDate"
                            value={estDeliveryDateValue}
                            onchange={handleEstDeliveryDateChange}
                        ></lightning-input>
                        <template lwc:if={showEstDeliveryDateSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleEstDeliveryDateSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleEstDeliveryDateCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="number"
                            step="1"
                            label="Hierarchy Level"
                            name="hierarchyLevel"
                            value={hierarchyLevelValue}
                            onchange={handleHierarchyLevelChange}
                        ></lightning-input>
                        <template lwc:if={showHierarchyLevelSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleHierarchyLevelSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleHierarchyLevelCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Preferred Delivery Hour"
                            name="prefDeliveryHour"
                            value={prefDeliveryHourValue}
                            options={prefDeliveryHourOptions}
                            onchange={handlePrefDeliveryHourChange}
                        ></lightning-combobox>
                        <template lwc:if={showPrefDeliveryHourSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handlePrefDeliveryHourSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handlePrefDeliveryHourCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>

        <!-- Section 3: Update Terms -->
        <template lwc:if={isTermSectionVisible}>
            <lightning-accordion-section name="terms" label="Update Terms">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-slider
                            label="Term (year)"
                            name="term"
                            min="1"
                            max="5"
                            value={termValue}
                            onchange={handleTermChange}
                        ></lightning-slider>
                        <template lwc:if={showTermSaveCancel}>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    onclick={handleTermSave}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    onclick={handleTermCancel}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>
    </lightning-accordion>
</template>
